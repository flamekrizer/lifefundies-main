<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LifeFundies — India's most trusted holistic life-guidance ecosystem. Find clarity, confidence, and direction across 18 life domains." />
    <meta name="keywords" content="life guidance, mentorship, career counselling, emotional wellness, India, students, young professionals" />
    <title>LifeFundies — Redesigning Life Fundamentals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      // Set the theme attribute before first paint so the preloader below
      // never flashes the wrong (light/dark) background.
      try {
        var __t = localStorage.getItem('lifefundies-theme');
        document.documentElement.dataset.theme = __t === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <style>
      /* Inline preloader styles for instantaneous render before bundle downloads */
      :root[data-theme="dark"] {
        --init-bg: #09111F;
        --init-card-bg: rgba(18, 28, 45, 0.88);
        --init-border: rgba(148, 163, 184, 0.22);
        --init-primary: #7DD3FC;
        --init-text: #F8FAFC;
        --init-glow: rgba(125, 211, 252, 0.18);
      }
      :root[data-theme="light"] {
        --init-bg: #F8F5F0;
        --init-card-bg: #FFFFFF;
        --init-border: #E6E1DA;
        --init-primary: #2563EB;
        --init-text: #0F172A;
        --init-glow: rgba(37, 99, 235, 0.14);
      }
      #initial-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--init-bg);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .init-preloader-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 640px 420px at 50% 42%, var(--init-glow), transparent 70%);
      }
      .init-preloader-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .init-preloader-logo-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 72px;
        padding: 0 1.5rem;
        background: var(--init-card-bg);
        border: 1px solid var(--init-border);
        border-radius: 999px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        margin-bottom: 1.5rem;
        overflow: hidden;
        animation: init-breathe 2.4s ease-in-out infinite;
      }
      .init-preloader-shimmer {
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 30%, color-mix(in srgb, var(--init-primary) 30%, transparent) 50%, transparent 70%);
        transform: translateX(-120%);
        animation: init-shimmer 2.2s ease-in-out infinite;
      }
      .init-preloader-logo {
        position: relative;
        height: 34px;
        width: auto;
        object-fit: contain;
      }
      .init-preloader-dots {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .init-preloader-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--init-primary);
        animation: init-dot-pulse 1.1s ease-in-out infinite;
      }
      .init-preloader-dots span:nth-child(2) { animation-delay: 0.15s; }
      .init-preloader-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes init-shimmer {
        to { transform: translateX(120%); }
      }
      @keyframes init-breathe {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-4px) scale(1.03); }
      }
      @keyframes init-dot-pulse {
        0%, 80%, 100% { opacity: 0.25; transform: scale(0.75); }
        40% { opacity: 1; transform: scale(1); }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CFoccJlP.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BiHLbRFK.css">
  </head>
  <body>
    <div id="root">
      <div id="initial-preloader">
        <div class="init-preloader-glow"></div>
        <div class="init-preloader-content">
          <div class="init-preloader-logo-wrap">
            <img src="/logo.png" alt="LifeFundies" class="init-preloader-logo" id="init-preloader-logo" />
            <div class="init-preloader-shimmer"></div>
          </div>
          <div class="init-preloader-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>
    <script>
      if (document.documentElement.dataset.theme === 'dark') {
        document.getElementById('init-preloader-logo').src = '/logo-dark.png';
      }
    </script>
  </body>
</html>
